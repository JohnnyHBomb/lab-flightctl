name: flightctl-parser-fuzz

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: flightctl-parser-fuzz
  cancel-in-progress: true

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install locked test tools
        run: python -m pip install --no-deps -r deploy/requirements-ci.lock
      - name: Run bounded parser properties
        env:
          FLIGHTCTL_INTEGRATION_PHASE: scaffold
        run: python -m pytest -q tests/integration/test_parser_properties.py
