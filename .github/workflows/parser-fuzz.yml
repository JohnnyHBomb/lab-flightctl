name: flightctl-parser-fuzz

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: flightctl-parser-fuzz
  cancel-in-progress: true

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked test tools
        run: |
          python -m pip install --no-deps -r deploy/requirements-ci.lock
          python -m pip check
      - name: Run bounded parser properties
        env:
          FLIGHTCTL_INTEGRATION_PHASE: scaffold
        run: python -m pytest -q tests/integration/test_parser_properties.py
